<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امیر ارسلان حکیمی | Amir Arsalan Hakimi</title>
<meta name="description" content="وبلاگ شخصی امیر ارسلان حکیمی (Amir Arsalan Hakimi)؛ نوشته‌ها، یادداشت‌ها و تصاویر.">
<meta name="author" content="امیر ارسلان حکیمی">
<meta property="og:title" content="امیر ارسلان حکیمی | Amir Arsalan Hakimi">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","url":"https://amirarsalanhakim.github.io/","name":"امیر ارسلان حکیمی","alternateName":"Amir Arsalan Hakimi","description":"نویسندهٔ وبلاگ شخصی","sameAs":["https://www.facebook.com/share/1DfaK7yF9p/","https://www.instagram.com/amir_arsalan_hakimi/"]}</script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1f1d1a;--muted:#6b665f;--accent:#c2410c;--line:#e8e3dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--text:#f1ede8;--muted:#a39d94;--accent:#fb923c;--line:#34302b}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--text:#f1ede8;--muted:#a39d94;--accent:#fb923c;--line:#34302b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
header>a{color:var(--text);text-decoration:none;font-weight:700;font-size:1.25rem}
header>a span{color:var(--accent)}
nav{display:flex;gap:10px;align-items:center;font-size:.9rem;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none}
.hero{padding:44px 0 20px}
.hero h1{font-size:2rem;margin:0 0 8px;line-height:1.5}
.hero p{color:var(--muted);margin:0 0 16px}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px 0;display:block;color:inherit;text-decoration:none;transition:border-color .15s}
.post:hover{border-color:var(--accent)}
.meta{font-size:.82rem;color:var(--muted)}
.tag{color:var(--accent);font-weight:500}
.post h2{margin:4px 0;font-size:1.2rem;line-height:1.6}
.post p{margin:0;color:var(--muted);font-size:.95rem}
article{padding:36px 0}
article h1{font-size:1.9rem;line-height:1.6;margin:8px 0 20px}
article p{font-size:1.05rem;margin:0 0 18px}
.back{display:inline-block;color:var(--accent);text-decoration:none;margin:24px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:32px 0}
.box h3{margin:0 0 8px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0}
textarea{min-height:220px}
button{font-family:inherit;font-size:.9rem;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
footer{border-top:1px solid var(--line);padding:24px 0 32px;color:var(--muted);font-size:.85rem;text-align:center}
.social{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.social a{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 16px;background:var(--card);font-size:.9rem}
.social a:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:16px 0}
.grid figure{margin:0;position:relative}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.grid figure button{position:absolute;top:8px;left:8px;background:var(--card)}
</style>
</head>
<body>
<div class="wrap">
<header>
<a href="#home">امیر ارسلان <span>حکیمی</span></a>
<nav id="nav"><a href="#gallery">گالری</a><a href="#about">دربارهٔ من</a><button id="share">کپی لینک</button><button id="theme" aria-label="تغییر تم">◐</button></nav>
</header>
<main id="app"></main>
<footer><div class="social"><a href="https://www.facebook.com/share/1DfaK7yF9p/" target="_blank" rel="me noopener">فیس‌بوک</a><a href="https://www.instagram.com/amir_arsalan_hakimi/" target="_blank" rel="me noopener">اینستاگرام</a><a href="https://wa.me/93749676781" target="_blank" rel="noopener">واتس‌اپ</a></div>© ۱۴۰۵ — امیر ارسلان حکیمی · Amir Arsalan Hakimi</footer>
</div>
<script id="gdata" type="application/json">[]</script>
<script id="data" type="application/json">[{"id":"p1","tag":"نوشتن","date":"۲۸ آبان ۱۴۰۵","title":"چرا شروع به نوشتن کردم","text":"همیشه فکر می‌کردم نوشتن کار کسانی است که حرف مهمی برای گفتن دارند. بعد فهمیدم نوشتن خودش کمک می‌کند حرف‌هایم را پیدا کنم.\n\nاین وبلاگ جایی است برای فکرهای نیمه‌تمام و چیزهایی که یاد می‌گیرم."},{"id":"p2","tag":"یادگیری","date":"۲۱ آبان ۱۴۰۵","title":"یادگرفتن به‌روش قدم‌های کوچک","text":"هر وقت سراغ مهارت تازه‌ای رفتم، روزهای اول پرانرژی بودم و بعد رها کردم. چیزی که جواب داد، ده دقیقه تمرین روزانه بود.\n\nمهم این است که فردا هم بتوانی همین کار را تکرار کنی."}]</script>
<script>
var photos=JSON.parse(document.getElementById("gdata").textContent);
var posts=JSON.parse(document.getElementById("data").textContent);
var owner=false,app=document.getElementById("app");
function h(tag,props,kids){var e=document.createElement(tag);
for(var k in (props||{})){if(k==="text")e.textContent=props[k];else if(k==="on")e.onclick=props[k];else e.setAttribute(k,props[k])}
(kids||[]).forEach(function(c){e.appendChild(c)});return e}
function put(){app.innerHTML="";Array.prototype.slice.call(arguments).forEach(function(n){app.appendChild(n)})}
function meta(p){return h("div",{class:"meta"},[h("span",{class:"tag",text:p.tag}),document.createTextNode(" · "+p.date)])}
function home(){
var list=posts.map(function(p){var first=p.text.split("\n\n")[0];
return h("a",{class:"post",href:"#"+p.id},[meta(p),h("h2",{text:p.title}),h("p",{text:first})])});
put(h("section",{class:"hero"},[h("h1",{text:"نوشته‌های امیر ارسلان حکیمی"}),h("p",{text:"همهٔ نوشته‌های من اینجاست. لینک این صفحه را نگه دار و هر وقت خواستی برگرد."})]),
...(list.length?list:[h("p",{class:"meta",text:"هنوز نوشته‌ای منتشر نشده."})]));
}
function show(p){
var kids=[meta(p),h("h1",{text:p.title})];
p.text.split("\n\n").forEach(function(t){kids.push(h("p",{text:t}))});
kids.push(h("a",{class:"back",href:"#home",text:"← همهٔ نوشته‌ها"}));
if(owner){kids.push(h("button",{text:"حذف این نوشته",on:function(){if(confirm("حذف شود؟")){posts=posts.filter(function(x){return x.id!==p.id});save()}}}))}
put(h("article",{},kids));
}
function about(){put(h("div",{class:"box"},[h("h3",{text:"دربارهٔ من"}),h("p",{text:"این‌جا معرفی خودت را می‌نویسی. از من بخواه این متن را عوض کنم."})]),h("a",{class:"back",href:"#home",text:"← بازگشت"}))}
function editor(){
if(!owner){location.hash="home";return}
var t=h("input",{placeholder:"عنوان"}),g=h("input",{placeholder:"موضوع (مثلاً کتاب)"}),b=h("textarea",{placeholder:"متن نوشته؛ پاراگراف‌ها را با یک خط خالی جدا کن"});
put(h("div",{class:"box"},[h("h3",{text:"نوشتهٔ جدید"}),t,g,b,h("button",{class:"main",text:"انتشار",on:function(){
if(!t.value.trim()||!b.value.trim())return;
posts.unshift({id:"p"+Date.now(),tag:g.value.trim()||"یادداشت",date:new Date().toLocaleDateString("fa-IR",{day:"numeric",month:"long",year:"numeric"}),title:t.value.trim(),text:b.value.trim()});
save()}})]));
}
function gallery(){
var kids=[h("h1",{text:"گالری",style:"margin:32px 0 8px"}),h("p",{class:"meta",text:photos.length?"":"هنوز عکسی اضافه نشده."})];
if(owner){var inp=h("input",{type:"file",accept:"image/*",multiple:"multiple"});
var btn=h("button",{class:"main",text:"افزودن عکس",on:async function(){
if(!inp.files.length)return;btn.textContent="در حال بارگذاری…";btn.disabled=true;
try{var as=await claude.use("assets");if(!as)throw 0;
for(var i=0;i<inp.files.length;i++){var r=await as.upload(inp.files[i]);photos.push({id:r.id,url:r.url})}
window.keepHash=true;await save()}catch(e){alert("بارگذاری نشد؛ دوباره تلاش کن.");btn.textContent="افزودن عکس";btn.disabled=false}}});
kids.push(h("div",{class:"box"},[inp,btn]))}
var grid=h("div",{class:"grid"},photos.map(function(p){
var fig=h("figure",{},[h("a",{href:p.url,target:"_blank",rel:"noopener"},[h("img",{src:p.url,alt:"عکس امیر ارسلان حکیمی",loading:"lazy"})])]);
if(owner)fig.appendChild(h("button",{text:"حذف",on:function(){if(confirm("حذف شود؟")){photos=photos.filter(function(x){return x.id!==p.id});window.keepHash=true;save()}}}));
return fig}));
kids.push(grid);put(h("div",{},kids));
}
function route(){var x=location.hash.slice(1);
var p=posts.filter(function(q){return q.id===x})[0];
if(p)show(p);else if(x==="about")about();else if(x==="write")editor();else if(x==="gallery")gallery();else home();window.scrollTo(0,0)}
async function save(){
try{var art=await claude.use("artifact");if(!art)return;
var c=document.documentElement.cloneNode(true);
c.querySelector("#app").innerHTML="";c.removeAttribute("data-theme");
var n=c.querySelector("#nav");var w=n.querySelector("#write");if(w)w.remove();
c.querySelector("#gdata").textContent=JSON.stringify(photos).replace(/</g,"\\u003c");c.querySelector("#data").textContent=JSON.stringify(posts).replace(/</g,"\\u003c");
if(!window.keepHash)location.hash="home";
await art.publish("<!DOCTYPE html>\n"+c.outerHTML)}catch(e){alert("ذخیره نشد؛ دوباره تلاش کن.")}}
window.addEventListener("hashchange",route);route();
document.getElementById("theme").onclick=function(){var r=document.documentElement;
var d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
document.getElementById("share").onclick=function(){try{navigator.clipboard.writeText(location.href.split("#")[0]);this.textContent="کپی شد ✓"}catch(e){prompt("لینک:",location.href)}};
</script>
</body>
</html>
